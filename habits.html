<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrar hábitos - biUNestar</title>
  <link rel="icon" href="assets/favicon.ico" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html">
        <i class="fas fa-heartbeat me-2"></i>biUNestar
      </a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="fas fa-user me-1"></i> <span id="navUserName">Cuenta</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Perfil</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><button class="dropdown-item" id="logoutBtn">Cerrar sesión</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <div class="col-lg-2 col-md-3 d-none d-md-block sidebar p-3">
        <h5 class="text-center mb-4 mt-2"><i class="fas fa-compass me-2"></i>Menú</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="habits.html"><i class="fas fa-plus-circle me-2"></i>Registrar hábitos</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html"><i class="fas fa-history me-2"></i>Historial</a></li>
          <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fas fa-chart-line me-2"></i>Reportes</a></li>
          <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="fas fa-bell me-2"></i>Recordatorios</a></li>
          <li class="nav-item"><a class="nav-link" href="resources.html"><i class="fas fa-book me-2"></i>Recursos</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html"><i class="fas fa-comment-dots me-2"></i>Retroalimentación</a></li>
          <li id="adminMenuItem" class="nav-item d-none">
            <a class="nav-link" href="admin_users.html"><i class="fas fa-user-shield me-2"></i>Administración</a>
          </li>
        </ul>
      </div>

      <div class="col-lg-10 col-md-9 p-4">

        <div id="alertsArea"></div>

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <h4 class="mb-0">Registrar hábitos</h4>
          <div>
            <label for="recordDate" class="form-label small text-muted mb-0 me-2">Fecha</label>
            <input type="date" id="recordDate" class="form-control d-inline-block" style="width: auto;" />
          </div>
        </div>

        <form id="habitForm" class="card stat-card">
          <div class="card-body p-4">

            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="fas fa-moon text-primary me-1"></i> Horas de sueño
                <span class="badge text-bg-primary ms-2" id="sleepValue">8</span>
              </label>
              <input type="range" class="form-range" id="sleepHours" min="0" max="24" step="1" value="8" />
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="fas fa-glass-water text-info me-1"></i> Vasos/botellas de agua
                <span class="badge text-bg-info ms-2" id="waterValue">4</span>
              </label>
              <input type="range" class="form-range" id="waterIntake" min="0" max="20" step="1" value="4" />
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="fas fa-person-running text-success me-1"></i> Minutos de actividad física
                <span class="badge text-bg-success ms-2" id="activityValue">30</span>
              </label>
              <input type="range" class="form-range" id="activityMinutes" min="0" max="180" step="5" value="30" />
            </div>

            <div class="mb-4">
              <label class="form-label fw-semibold d-block mb-2">Estado de ánimo</label>
              <div id="moodOptions" class="d-flex flex-wrap gap-2"></div>
            </div>

            <div class="mb-4">
              <label for="comment" class="form-label fw-semibold">
                Comentario <span class="text-muted fw-normal">(opcional)</span>
              </label>
              <textarea id="comment" class="form-control" rows="3" maxlength="500"
                placeholder="¿Por qué te sientes así hoy?"></textarea>
              <div class="form-text text-end"><span id="commentCount">0</span>/500</div>
            </div>

            <button type="submit" class="btn btn-primary" id="submitBtn">
              <i class="fas fa-check me-1"></i> Guardar registro
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/habits.js"></script>
</body>
</html>
