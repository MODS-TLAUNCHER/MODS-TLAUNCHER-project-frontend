<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión - biUNestar</title>
  <link rel="icon" href="assets/favicon.ico" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />

  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="container">
    <div class="card auth-card">
      <div class="card-body p-5 text-center">
        <i class="fas fa-heartbeat fa-2x mb-3" style="color: var(--primary-color);"></i>
        <h3 class="mb-1">biUNestar</h3>
        <p class="text-muted mb-4">Bienestar universitario</p>

        <p class="mb-4">
          Inicia sesión con tu correo institucional de la Universidad Nacional.
        </p>

        <div id="googleButtonContainer" class="d-flex justify-content-center"></div>

        <div id="loginStatus" class="mt-3"></div>
        <hr class="my-4" />
        <p class="text-muted small mb-2">
          <a href="#" data-bs-toggle="collapse" data-bs-target="#passwordLoginBox">
            ¿Tienes una cuenta creada por un administrador? Inicia sesión con correo y contraseña
          </a>
        </p>

        <div class="collapse" id="passwordLoginBox">
          <form id="passwordLoginForm" class="text-start mt-3">
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Correo</label>
              <input type="email" id="loginEmail" class="form-control" required />
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Contraseña</label>
              <input type="password" id="loginPassword" class="form-control" required />
            </div>
            <button type="submit" class="btn btn-outline-primary w-100" id="passwordLoginBtn">
              Iniciar sesión
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
