<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recursos de apoyo - biUNestar</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html">
        <i class="fas fa-heartbeat me-2"></i>biUNestar
      </a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="fas fa-user me-1"></i> <span id="navUserName">Cuenta</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Perfil</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><button class="dropdown-item" id="logoutBtn">Cerrar sesión</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <div class="col-lg-2 col-md-3 d-none d-md-block sidebar p-3">
        <h5 class="text-center mb-4 mt-2"><i class="fas fa-compass me-2"></i>Menú</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="habits.html"><i class="fas fa-plus-circle me-2"></i>Registrar hábitos</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html"><i class="fas fa-history me-2"></i>Historial</a></li>
          <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fas fa-chart-line me-2"></i>Reportes</a></li>
          <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="fas fa-bell me-2"></i>Recordatorios</a></li>
          <li class="nav-item"><a class="nav-link active" href="resources.html"><i class="fas fa-book me-2"></i>Recursos</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html"><i class="fas fa-comment-dots me-2"></i>Retroalimentación</a></li>
          <li id="adminMenuItem" class="nav-item d-none">
            <a class="nav-link" href="admin_users.html"><i class="fas fa-user-shield me-2"></i>Administración</a>
          </li>
        </ul>
      </div>

      <div class="col-lg-10 col-md-9 p-4">

        <div id="alertsArea"></div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <h4 class="mb-0">Recursos de apoyo</h4>
          <button class="btn btn-primary btn-sm d-none" id="newResourceBtn" data-bs-toggle="modal" data-bs-target="#resourceModal">
            <i class="fas fa-plus me-1"></i> Nuevo recurso
          </button>
        </div>

        <div class="row" id="resourcesGrid">
          <p class="text-muted">Cargando...</p>
        </div>

      </div>
    </div>
  </div>

  <div class="modal fade" id="resourceModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="resourceForm">
          <div class="modal-header">
            <h5 class="modal-title" id="resourceModalTitle">Nuevo recurso</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="resourceId" />

            <div class="mb-3">
              <label for="resourceTitle" class="form-label">Título</label>
              <input type="text" id="resourceTitle" class="form-control" maxlength="150" required />
            </div>

            <div class="mb-3">
              <label for="resourceType" class="form-label">Tipo</label>
              <select id="resourceType" class="form-select" required>
                <option value="Articulo">Artículo</option>
                <option value="Enlace">Enlace</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="resourceUrl" class="form-label">URL</label>
              <input type="url" id="resourceUrl" class="form-control" placeholder="https://..." />
            </div>

            <div class="mb-3">
              <label for="resourceDescription" class="form-label">Descripción</label>
              <textarea id="resourceDescription" class="form-control" rows="3"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary" id="resourceSubmitBtn">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/resources.js"></script>
</body>
</html>
