{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Registrarse - biUNestar{% endblock %}
{% block page_header %}Crear Cuenta{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Registro de Usuario</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Registrarse</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                ¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia Sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
