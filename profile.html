<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi perfil - biUNestar</title>
  <link rel="icon" href="assets/favicon.ico" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="dashboard.html">
        <i class="fas fa-heartbeat me-2"></i>biUNestar
      </a>
      <div class="collapse navbar-collapse justify-content-end">
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
              <i class="fas fa-user me-1"></i> <span id="navUserName">Cuenta</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item active" href="profile.html">Perfil</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><button class="dropdown-item" id="logoutBtn">Cerrar sesión</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">

      <div class="col-lg-2 col-md-3 d-none d-md-block sidebar p-3">
        <h5 class="text-center mb-4 mt-2"><i class="fas fa-compass me-2"></i>Menú</h5>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home me-2"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="habits.html"><i class="fas fa-plus-circle me-2"></i>Registrar hábitos</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html"><i class="fas fa-history me-2"></i>Historial</a></li>
          <li class="nav-item"><a class="nav-link" href="reports.html"><i class="fas fa-chart-line me-2"></i>Reportes</a></li>
          <li class="nav-item"><a class="nav-link" href="reminders.html"><i class="fas fa-bell me-2"></i>Recordatorios</a></li>
          <li class="nav-item"><a class="nav-link" href="resources.html"><i class="fas fa-book me-2"></i>Recursos</a></li>
          <li class="nav-item"><a class="nav-link" href="feedback.html"><i class="fas fa-comment-dots me-2"></i>Retroalimentación</a></li>
          <li id="adminMenuItem" class="nav-item d-none">
            <a class="nav-link" href="admin_users.html"><i class="fas fa-user-shield me-2"></i>Administración</a>
          </li>
        </ul>
      </div>

      <div class="col-lg-10 col-md-9 p-4">

        <div id="alertsArea"></div>

        <h4 class="mb-4">Mi perfil</h4>

        <form id="profileForm" class="card stat-card">
          <div class="card-body p-4">

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Correo institucional</label>
                <input type="text" class="form-control" id="institutionalEmail" disabled />
                <div class="form-text">Vinculado a tu cuenta de Google, no se puede editar aquí.</div>
              </div>

              <div class="col-md-6">
                <label for="fullName" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="fullName" required />
              </div>

              <div class="col-md-6">
                <label for="career" class="form-label">Carrera académica</label>
                <input type="text" class="form-control" id="career" placeholder="Ej: Ingeniería de Sistemas" />
              </div>

              <div class="col-md-6">
                <label for="credits" class="form-label">Créditos matriculados este semestre</label>
                <input type="number" class="form-control" id="credits" min="0" />
              </div>

              <div class="col-md-6">
                <label for="alternativeEmail" class="form-label">Correo alternativo <span class="text-muted fw-normal">(opcional)</span></label>
                <input type="email" class="form-control" id="alternativeEmail" />
              </div>

              <div class="col-md-6">
                <label for="stressLevel" class="form-label">
                  Nivel de estrés percibido <span class="text-muted fw-normal">(opcional, 1-5)</span>
                  <span class="badge text-bg-secondary ms-1" id="stressValue">-</span>
                </label>
                <input type="range" class="form-range" id="stressLevel" min="1" max="5" step="1" />
              </div>

              <div class="col-12">
                <label for="goal" class="form-label">Meta o motivación principal</label>
                <textarea class="form-control" id="goal" rows="3"
                  placeholder="¿Qué esperas lograr cuidando tu bienestar este semestre?"></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-primary mt-4" id="profileSubmitBtn">
              <i class="fas fa-check me-1"></i> Guardar cambios
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
